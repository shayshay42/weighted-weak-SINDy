[project]
name = "weighted-weak-sindy"
version = "0.2.0"
description = "Information-controlled Lorenz63 benchmark with strong, weak, and endpoint-weighted weak SINDy comparators."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "matplotlib>=3.7",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
panda = [
  "huggingface-hub>=0.19",
  "safetensors>=0.4",
  "transformers==4.40.2",
  "panda @ git+https://github.com/abao1999/panda.git@c229e7c8c49cbe294458c44160248bb17856a715",
]
tabpfn = [
  "tabpfn==8.2.0",
]
chronos = [
  "chronos-forecasting @ git+https://github.com/CTF-for-Science/chronos-forecasting.git@721a53459156b7264e24787f7a8fc75a1c5d6d0f",
]
odeformer = [
  "odeformer @ git+https://github.com/sdascoli/odeformer.git@c9193012ad07a97186290b98d8290d1a177f4609",
]
ctf = [
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/shayshay42/weighted-weak-SINDy"

[project.scripts]
lorenz63-v2-data = "lorenz63_benchmark.v2.data:main"
lorenz63-v2-tune = "lorenz63_benchmark.v2.tune:main"
lorenz63-v2-train = "lorenz63_benchmark.v2.train:main"
lorenz63-v2-evaluate = "lorenz63_benchmark.v2.evaluate:main"
lorenz63-v2-aggregate = "lorenz63_benchmark.v2.aggregate:main"
lorenz63-v2-worker = "lorenz63_benchmark.v2.worker:main"
lorenz63-v2-prepare = "lorenz63_benchmark.v2.prepare:main"
lorenz63-v2-smoke = "lorenz63_benchmark.v2.smoke:main"
lorenz63-v2-validate = "lorenz63_benchmark.v2.validate:main"
lorenz63-v2-merge-tuning = "lorenz63_benchmark.v2.merge_tuning:main"
lorenz63-v2-prepare-tuning = "lorenz63_benchmark.v2.prepare_tuning:main"
lorenz63-v2-attractor-summary = "lorenz63_benchmark.v2.attractor_summary:main"
lorenz63-v2-visualize = "lorenz63_benchmark.v2.visualize:main"
lorenz63-v2-extend-survival = "lorenz63_benchmark.v2.extend_survival:main"
lorenz63-v2-context-matched = "lorenz63_benchmark.v2.context_matched:main"
lorenz63-v2-prepare-context-matched = "lorenz63_benchmark.v2.prepare_context_matched:main"
lorenz63-v2-few-shot = "lorenz63_benchmark.v2.few_shot:main"
lorenz63-v2-prepare-few-shot = "lorenz63_benchmark.v2.prepare_few_shot:main"
amortized-sindy-v1-smoke = "amortized_sindy.v1.smoke:main"
amortized-sindy-v1-multifamily-data = "amortized_sindy.v1.multifamily_data:main"
amortized-sindy-v1-multifamily-train = "amortized_sindy.v1.multifamily_train:main"
amortized-sindy-v1-multifamily-infer = "amortized_sindy.v1.multifamily_infer:main"
amortized-sindy-v1-multifamily-evaluate = "amortized_sindy.v1.multifamily_evaluate:main"
amortized-sindy-v1-source-teacher = "amortized_sindy.v1.source_teacher:main"
amortized-sindy-v1-foundation-embed = "amortized_sindy.v1.foundation_embed:main"
amortized-sindy-v1-tabpfn-pilot = "amortized_sindy.v1.tabpfn_pilot:main"
amortized-sindy-v1-native-forecast-gate = "amortized_sindy.v1.native_forecast_gate:main"
amortized-sindy-v1-trajectory-features = "amortized_sindy.v1.trajectory_conditioner_features:main"
amortized-sindy-v1-birkhoff-ablation = "amortized_sindy.v1.birkhoff_ablation:main"
amortized-sindy-v1-weak-invariant-ablation = "amortized_sindy.v1.weak_invariant_ablation:main"
amortized-sindy-v1-odeformer-gate = "amortized_sindy.v1.odeformer_gate:main"
amortized-sindy-v1-odeformer-infer = "amortized_sindy.v1.odeformer_infer:main"
amortized-sindy-v1-odeformer-ctf-predict = "amortized_sindy.v1.odeformer_ctf_predict:main"
amortized-sindy-v1-ctf-predict = "amortized_sindy.v1.ctf_predict:main"
amortized-sindy-v1-ctf-evaluate = "amortized_sindy.v1.ctf_evaluate:main"

[tool.setuptools.packages.find]
include = ["lorenz63_benchmark*", "amortized_sindy*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
